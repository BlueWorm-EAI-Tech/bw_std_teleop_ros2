kinematics_node:
  ros__parameters:
    root_link: C_Link
    left_tip_link: A_left_Degree7_link
    right_tip_link: A_right_Degree7_link
    locked_lift_joint: C_joint
    ik_model_path: ""
    joint_state_topic: /joint_states
    left_target_topic: /target_left_pose
    right_target_topic: /target_right_pose
    left_current_pose_topic: /current_left_pose
    right_current_pose_topic: /current_right_pose
    trajectory_topic: /dual_arm_controller/joint_trajectory
    joint_state_timeout_ms: 200
    max_iterations: 80
    continuity_weight: 0.02
    max_position_residual: 0.03
    max_orientation_residual: 0.25
    # 防跳变上限.
    max_joint_step_rad: 1.5
    # Ruckig 轨迹平滑约束(与 standard_0907 smoother 同参数)
    trajectory_max_velocity_rad_s: 12.0
    trajectory_max_acceleration_rad_s2: 400.0
    trajectory_max_jerk_rad_s3: 8000.0
    # 移动目标速度前馈(与 standard_0907 smoother 同参数)
    target_velocity_scale: 0.5
    max_target_velocity_rad_s: 3.0
    target_velocity_filter_alpha: 0.15
    target_prediction_max_time_sec: 0.02
    # 连续跟踪器频率
    tracking_rate_hz: 200.0
    # 关节空间复位(实测关节 -> 零位)轨迹时长与触发 topic.
    reset_duration_sec: 3.0
    reset_topic: /kinematics/reset_arms
